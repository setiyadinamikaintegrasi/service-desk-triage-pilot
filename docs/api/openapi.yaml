openapi: 3.0.3
info:
  title: Service Desk Triage Pilot API
  version: 0.1.0
  description: Internal pilot API; not production-ready and unauthenticated by design; do not expose secrets.
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: Local pilot server
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service unavailable (reserved for future dependency checks).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/tickets:
    post:
      operationId: createTicket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: Ticket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      operationId: listTickets
      security: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TicketStatus'
        - name: priority
          in: query
          schema:
            $ref: '#/components/schemas/TicketPriority'
      responses:
        '200':
          description: Ticket list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ticket'
  /api/v1/tickets/{ticket_id}:
    get:
      operationId: getTicket
      security: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Ticket detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tickets/{ticket_id}/triage:
    post:
      operationId: triageTicket
      security: []
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: Validated deterministic triage result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageResult'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Ticket not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    ValidationError:
      description: Input validation failed.
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
    TicketStatus:
      type: string
      enum: [open, in_progress, resolved]
    TicketPriority:
      type: string
      enum: [critical, high, medium, low]
    TicketCreate:
      type: object
      required: [title, description, reporter]
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, minLength: 1, maxLength: 4000}
        reporter: {type: string, minLength: 1, maxLength: 320}
    TriageResult:
      type: object
      required: [category, priority, summary, confidence, reasoning_code]
      properties:
        category: {type: string}
        priority: {$ref: '#/components/schemas/TicketPriority'}
        summary: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        reasoning_code: {type: string}
    Ticket:
      allOf:
        - $ref: '#/components/schemas/TicketCreate'
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            status: {$ref: '#/components/schemas/TicketStatus'}
            priority:
              $ref: '#/components/schemas/TicketPriority'
              nullable: true
            triage:
              $ref: '#/components/schemas/TriageResult'
              nullable: true
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    NotFoundError:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [not_found]}
            message: {type: string}
